# Perfil de pruebas. Todos los valores son FALSOS y PUBLICOS: solo sirven en local y en CI.
# Base de datos de pruebas: crea una vez el usuario y la base actaflow_test (ver README).
spring:
  datasource:
    url: ${ACTAFLOW_TEST_DB_URL:jdbc:postgresql://localhost:5432/actaflow_test}
    username: ${ACTAFLOW_TEST_DB_USERNAME:actaflow_test}
    password: ${ACTAFLOW_TEST_DB_PASSWORD:actaflow_test}
  flyway:
    clean-disabled: false

actaflow:
  bff:
    hmac-secret: secreto-de-prueba-publico-solo-para-tests-0123456789
    max-body-bytes: 2048
  motor:
    # Puerto 9 (discard): no hay nadie escuchando, el motor aparece CAIDO salvo que el
    # test levante un motor falso y sobrescriba esta URL.
    url: http://127.0.0.1:9
    hmac-secret: secreto-motor-de-prueba-publico-solo-para-tests-01
    connect-timeout: 1s
    request-timeout: 2s
  estado:
    timeout-base-datos: 5s
    timeout-motor: 3s
