# ActaFlow - Backend. Toda la configuracion sensible llega por variables de entorno.
spring:
  application:
    name: actaflow-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ACTAFLOW_DB_URL:jdbc:postgresql://localhost:5432/actaflow}
    username: ${ACTAFLOW_DB_USERNAME:actaflow}
    password: ${ACTAFLOW_DB_PASSWORD:}
    hikari:
      pool-name: actaflow
      maximum-pool-size: 5
      # Neon Free suspende el computo tras 5 min sin actividad. Con minimum-idle 0 el pool
      # cierra sus conexiones ociosas y no mantiene la base despierta gastando horas-CU.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
      # Margen para el arranque en frio de Neon.
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:9097}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
  tomcat:
    max-swallow-size: 6MB
    max-http-form-post-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    # Render consulta /actuator/health con frecuencia: si incluyera la base de datos,
    # mantendria Neon despierto todo el tiempo. El estado de la base va en /api/v1/status.
    db:
      enabled: false

actaflow:
  version: '@project.version@'
  hmac:
    tolerance-seconds: ${ACTAFLOW_HMAC_TOLERANCE_SECONDS:300}
  bff:
    hmac-secret: ${ACTAFLOW_BFF_HMAC_SECRET:}
    max-body-bytes: 5242880
  motor:
    url: ${ACTAFLOW_ENGINE_URL:http://localhost:8002}
    hmac-secret: ${ACTAFLOW_ENGINE_HMAC_SECRET:}
    connect-timeout: 3s
    request-timeout: 6s
  estado:
    timeout-base-datos: 15s
    timeout-motor: 7s

logging:
  level:
    root: INFO
    com.actaflow: INFO
