# ActaFlow - identity-service. Toda la configuracion sensible llega por variables de entorno.
spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ACTAFLOW_DB_URL:jdbc:postgresql://localhost:5432/actaflow}
    username: ${ACTAFLOW_DB_USERNAME:actaflow}
    password: ${ACTAFLOW_DB_PASSWORD:}
    hikari:
      pool-name: identity
      # Esquema propio: misma base de Neon que legal-case-service, tablas separadas.
      schema: identity
      maximum-pool-size: 3
      # Neon Free suspende el computo tras 5 min sin actividad. Con minimum-idle 0 el pool
      # cierra sus conexiones ociosas y no mantiene la base despierta gastando horas-CU.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
      # Margen para el arranque en frio de Neon.
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: identity
    default-schema: identity
    create-schemas: true

server:
  port: ${PORT:9098}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    # Render consulta /actuator/health con frecuencia: si incluyera la base de datos,
    # mantendria Neon despierto. El estado de la base va en GetServiceStatus (gRPC).
    db:
      enabled: false

actaflow:
  version: '@project.version@'
  hmac:
    tolerance-seconds: ${ACTAFLOW_HMAC_TOLERANCE_SECONDS:300}
  grpc:
    # gRPC nativo (HTTP/2). En Render Free no hay HTTP/2 publico: el Dockerfile lo desactiva (-1)
    # y el BFF llega por gRPC-Web al puerto web.
    native-port: ${ACTAFLOW_GRPC_NATIVE_PORT:9198}
    max-message-bytes: 4194304
    web-deadline: 30s
  bff:
    hmac-secret: ${ACTAFLOW_IDENTITY_HMAC_SECRET:}
  seguridad:
    # Entra en el hash de verificadores, tokens de refresco, invitaciones y codigos de recuperacion.
    pepper: ${ACTAFLOW_IDENTITY_PEPPER:}
    # Semilla de la clave Ed25519 que firma los tokens de acceso.
    token-secret: ${ACTAFLOW_IDENTITY_TOKEN_SECRET:}
    access-token-ttl: 15m
  arranque:
    # Solo para el primer despliegue: crea la organizacion y la invitacion del primer administrador.
    organization-name: ${ACTAFLOW_BOOTSTRAP_ORGANIZATION:}
    admin-email: ${ACTAFLOW_BOOTSTRAP_ADMIN_EMAIL:}
    invitation-token: ${ACTAFLOW_BOOTSTRAP_INVITATION_TOKEN:}
  estado:
    timeout-base-datos: 15s

logging:
  level:
    root: INFO
    com.actaflow: INFO
