# ActaFlow - legal-case-service. Toda la configuracion sensible llega por variables de entorno.
spring:
  application:
    name: legal-case-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ACTAFLOW_DB_URL:jdbc:postgresql://localhost:5432/actaflow}
    username: ${ACTAFLOW_DB_USERNAME:actaflow}
    password: ${ACTAFLOW_DB_PASSWORD:}
    hikari:
      pool-name: legal-case
      # Esquema propio: misma base de Neon que identity-service, tablas separadas.
      schema: legal_case
      maximum-pool-size: 5
      # Neon Free suspende el computo tras 5 min sin actividad. Con minimum-idle 0 el pool
      # cierra sus conexiones ociosas y no mantiene la base despierta gastando horas-CU.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
      # Margen para el arranque en frio de Neon.
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: legal_case
    default-schema: legal_case
    create-schemas: true

server:
  port: ${PORT:9097}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    # Render consulta /actuator/health con frecuencia: si incluyera la base de datos,
    # mantendria Neon despierto. El estado de la base va en GetServiceStatus (gRPC).
    db:
      enabled: false

actaflow:
  version: '@project.version@'
  hmac:
    tolerance-seconds: ${ACTAFLOW_HMAC_TOLERANCE_SECONDS:300}
  grpc:
    # gRPC nativo (HTTP/2). En Render Free no hay HTTP/2 publico: el Dockerfile lo desactiva (-1)
    # y el BFF llega por gRPC-Web al puerto web.
    native-port: ${ACTAFLOW_GRPC_NATIVE_PORT:9197}
    max-message-bytes: 8388608
    web-deadline: 60s
  bff:
    hmac-secret: ${ACTAFLOW_LEGAL_CASE_HMAC_SECRET:}
  motor:
    # grpc: nativo sobre HTTP/2 (local, CI). grpc-web: HTTP/1.1 (Render Free; lo fija el Dockerfile).
    transport: ${ACTAFLOW_ENGINE_TRANSPORT:grpc}
    grpc-target: ${ACTAFLOW_ENGINE_GRPC_TARGET:localhost:8102}
    url: ${ACTAFLOW_ENGINE_URL:http://localhost:8002}
    hmac-secret: ${ACTAFLOW_ENGINE_HMAC_SECRET:}
    connect-timeout: 3s
    request-timeout: 30s
  estado:
    timeout-base-datos: 15s
    timeout-motor: 7s

logging:
  level:
    root: INFO
    com.actaflow: INFO
