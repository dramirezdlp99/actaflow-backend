name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: actaflow_test
          POSTGRES_PASSWORD: actaflow_test
          POSTGRES_DB: actaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actaflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # verify = checkstyle (lint) + compilacion + tests unitarios e integracion + jar
      - name: Lint, tests y empaquetado
        run: mvn -B verify

  imagen:
    name: Build de la imagen y prueba de humo
    runs-on: ubuntu-latest
    needs: verificar
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: actaflow_test
          POSTGRES_PASSWORD: actaflow_test
          POSTGRES_DB: actaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actaflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRETO_BFF: secreto-de-ci-publico-no-usar-en-produccion-bff-000
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t actaflow-backend:ci .
      - name: Arrancar con 512 MB, como en Render Free
        run: |
          docker run -d --name backend --network host --memory=512m \
            -e ACTAFLOW_DB_URL=jdbc:postgresql://localhost:5432/actaflow_test \
            -e ACTAFLOW_DB_USERNAME=actaflow_test -e ACTAFLOW_DB_PASSWORD=actaflow_test \
            -e ACTAFLOW_BFF_HMAC_SECRET=$SECRETO_BFF \
            -e ACTAFLOW_ENGINE_HMAC_SECRET=secreto-de-ci-publico-no-usar-en-produccion-mot-000 \
            -e ACTAFLOW_ENGINE_URL=http://127.0.0.1:9 \
            actaflow-backend:ci
      - name: Esperar /actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9097/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Llamar /api/v1/status firmado como el BFF
        run: |
          TS=$(date +%s)
          VACIO=$(printf '' | sha256sum | cut -d' ' -f1)
          FIRMA=$(printf '%s\nGET\n/api/v1/status\n%s' "$TS" "$VACIO" \
            | openssl dgst -sha256 -hmac "$SECRETO_BFF" | sed 's/^.*= //')
          curl -fsS http://localhost:9097/api/v1/status \
            -H "X-ActaFlow-Timestamp: $TS" -H "X-ActaFlow-Signature: $FIRMA" | tee status.json
          grep -q '"servicio":"actaflow-backend"' status.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9097/api/v1/status)" = "401"
      - name: Logs del contenedor
        if: always()
        run: docker logs backend
